<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("../../src/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body { font-family: "Inter", "Noto Sans SC", sans-serif; color: #fff; position: relative; }
  /* Faisceau lumineux du site, vu d'en haut. */
  .cone { position: absolute; top: 0; height: 260px; width: 520px; }
  .cone.l { right: 50%; background: conic-gradient(from 70deg at right top, #06b6d4, transparent, transparent); }
  .cone.r { left: 50%; background: conic-gradient(from 290deg at left top, transparent, transparent, #06b6d4); }
  .mask { position: absolute; left: 0; right: 0; top: 120px; height: 220px; background: linear-gradient(to bottom, transparent, #000 70%); }
  .glow { position: absolute; top: -70px; left: 50%; width: 520px; height: 150px; translate: -50% 0; border-radius: 50%; background: #06b6d4; filter: blur(60px); opacity: .55; }
  .line { position: absolute; top: 0; left: 50%; width: 520px; height: 2px; translate: -50% 0; background: #22d3ee; }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
  .badge { font-size: 22px; font-weight: 300; color: #d1d5db; border: 1px solid rgba(6,182,212,.45); box-shadow: 0 0 14px rgba(6,182,212,.25); border-radius: 999px; padding: 8px 22px; margin-bottom: 34px; }
  h1 { font-size: 76px; line-height: 1.08; font-weight: 500; letter-spacing: -0.01em; max-width: 1000px; }
  p { margin-top: 26px; font-size: 27px; font-weight: 300; color: #9ca3af; max-width: 900px; line-height: 1.4; }
  .brand { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 24px; }
  .brand b { font-weight: 500; } .brand span { color: #6b7280; font-weight: 300; }
  .brand img { width: 34px; height: 34px; }
</style>
</head>
<body>
  <div class="cone l"></div><div class="cone r"></div><div class="mask"></div><div class="glow"></div><div class="line"></div>
  <div class="content">
    <div class="badge" id="badge"></div>
    <h1 id="title"></h1>
    <p id="desc"></p>
  </div>
  <div class="brand"><img src="../../public/icon-192.png" alt=""><b>Devmaster</b><span>· devmaster.ai</span></div>
</body>
</html>
